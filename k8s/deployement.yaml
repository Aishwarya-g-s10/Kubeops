apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubeops
spec:
  replicas: 1

  selector:
    matchLabels:
      app: kubeops
    
  template:
    metadata:
      labels:
        app: kubeops
    spec:
      containers:
        - name: kubeops
          image: kubesentinel:dev
          ports:
            - containerPort: 8000