apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'kubeops'
        metrics_path: '/metrics'
        static_configs: 
          - targets:
            - 'kubeops.default.svc.cluster.local:8000'

    
